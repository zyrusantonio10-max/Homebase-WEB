<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Homebase | Dashboard</title>
  <meta name="robots" content="noindex">

  <!--
    Design Read: signed-in dashboard for students choosing a room and landlords answering requests, in the landing page's
    white + forest language, dial ENERGY 2 / RHYTHM 2 / MOTION 1.

    The screen's job (not a sidebar + stat row + chart + table shell):
    - Student: decide which room to request. The ranked match list IS the page; the top match gets the weight.
    - Landlord: answer waiting requests and keep bed availability true. Requests and beds are the page.

    Reasons (R-31):
    - Navigation: the landing page's floating pill, reused, so landing and dashboard feel like one product. Below md the links move to a bottom tab bar (thumb reach), and the pill keeps logo + log out.
    - Palette: same as landing. Forest + white + one lime accent. Lime only marks "open / lit": open beds, the top score, the pending-request count. That is the same meaning the lit window has on the landing page.
    - Identity motif: windows. One square per bed, lit lime when open. Every room and property shows its beds this way, always with the text count next to it so color is never the only signal.
    - Hierarchy: the best match is a large card with the score block and four factor bars. The rest are compact rows (details element) because their job is comparison, not reading. Reason written in R-14.
    - Numbers: every number on screen is computed from what users entered. No seeded stats, deltas, feeds or people. The optional sample listings are labeled "Sample" and can be removed in one click (R-38).
    - Radius: 8px controls, 12px cards, the nav pill is the only pill (it floats over content, so it must read as its own layer).
    - Shadow: nav only (elevation). Glass/blur: nav only. No glow, no grid, no gradients.
    - Type: Sora for headings and numbers, Public Sans for everything else, same as landing.
    - Motion: hover color transitions only. Nothing animates on load or loops.
    - Out of scope, said on screen where relevant: payments, contracts, maintenance, move logistics.
    - Data is LocalStorage for phase 1 (no backend). Every read/write is guarded; a bad read shows the error state.
  -->

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600&family=Sora:wght@600;700&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="assets/tw-config.js"></script>
  <script>
    // Style check: if Tailwind or assets/tw-config.js did not load, colors and fonts are missing and the page looks unstyled.
    // Inline styles on purpose, because this message has to show even when Tailwind is the thing that failed.
    window.addEventListener('DOMContentLoaded', function () {
      var ok = window.tailwind && tailwind.config && tailwind.config.theme && tailwind.config.theme.extend;
      if (ok) return;
      var d = document.createElement('div');
      d.setAttribute('role', 'alert');
      d.style.cssText = 'position:fixed;left:0;right:0;top:0;z-index:99;background:#FEF3F2;color:#B42318;padding:12px 16px;font:600 14px/1.4 system-ui,sans-serif';
      d.textContent = 'The styles did not load. Keep dashboard.html in the same folder as index.html and the assets folder (assets/tw-config.js), and check your internet connection, because Tailwind loads from a CDN.';
      document.body.insertBefore(d, document.body.firstChild);
    });
  </script>

  <style type="text/tailwindcss">
    @layer components {
      .label { @apply mb-1.5 block text-sm font-medium text-ink; }
      .hint { @apply mt-1.5 text-sm text-muted; }
      .field {
        @apply block w-full rounded-lg border border-line bg-white px-3.5 py-3 text-base text-ink
               placeholder:text-[#667369] outline-none transition-colors
               hover:border-[#8FA397] focus-visible:border-forest focus-visible:ring-2 focus-visible:ring-forest/30
               aria-[invalid=true]:border-danger aria-[invalid=true]:ring-danger/20;
      }
      .err { @apply mt-1.5 text-sm font-medium text-danger; }
      .btn {
        @apply inline-flex min-h-[48px] items-center justify-center rounded-lg bg-forest px-5 py-2 text-base font-semibold text-white
               transition-colors hover:bg-forest-deep outline-none
               focus-visible:ring-2 focus-visible:ring-forest focus-visible:ring-offset-2 disabled:cursor-wait disabled:opacity-70;
      }
      .btn2 {
        @apply inline-flex min-h-[44px] items-center justify-center rounded-lg border border-forest bg-white px-4 py-2 text-sm font-semibold text-forest
               transition-colors hover:bg-tint outline-none focus-visible:ring-2 focus-visible:ring-forest focus-visible:ring-offset-2;
      }
      .btn-danger {
        @apply inline-flex min-h-[44px] items-center justify-center rounded-lg border border-danger bg-white px-4 py-2 text-sm font-semibold text-danger
               transition-colors hover:bg-[#FEF3F2] outline-none focus-visible:ring-2 focus-visible:ring-danger focus-visible:ring-offset-2;
      }
      .btn-sm { @apply min-h-[44px] px-4 text-sm; }
      .linkbtn { @apply inline-flex min-h-[44px] items-center rounded font-semibold text-forest underline underline-offset-4 outline-none hover:text-forest-deep focus-visible:ring-2 focus-visible:ring-forest focus-visible:ring-offset-2; }
      .card { @apply rounded-xl border border-line bg-white; }
      .h2 { @apply font-display text-lg font-bold tracking-tight text-ink; }
      .navlink {
        @apply flex min-h-[44px] items-center justify-center gap-2 rounded-full px-4 text-sm font-semibold text-ink outline-none transition-colors
               hover:bg-ink/5 focus-visible:ring-2 focus-visible:ring-forest focus-visible:ring-offset-1
               aria-[current=page]:bg-forest aria-[current=page]:text-white;
      }
    }
  </style>
</head>

<body class="min-h-dvh bg-white font-body text-ink antialiased">

  <!-- FLOATING NAV (same pill as the landing page) -->
  <header class="pointer-events-none fixed inset-x-0 top-3 z-40 flex justify-center px-3">
    <nav aria-label="Dashboard" class="pointer-events-auto flex w-max max-w-full items-center gap-1 rounded-full border border-ink/10 bg-white/85 p-1.5 shadow-lg shadow-ink/10 backdrop-blur-md">
      <a id="logo" href="#" class="flex min-h-[44px] items-center gap-2.5 rounded-full pl-1.5 pr-3 font-display text-base font-bold tracking-tight text-ink outline-none focus-visible:ring-2 focus-visible:ring-forest" aria-label="Homebase dashboard home">
        <svg class="h-8 w-8 shrink-0" viewBox="0 0 32 32" aria-hidden="true">
          <rect width="32" height="32" rx="8" fill="#0B4A2F"/>
          <rect x="7" y="8" width="7" height="8" rx="1.5" fill="#083A25"/>
          <rect x="18" y="8" width="7" height="8" rx="1.5" fill="#C6F24E"/>
          <rect x="7" y="19" width="7" height="8" rx="1.5" fill="#083A25"/>
          <rect x="18" y="19" width="7" height="8" rx="1.5" fill="#083A25"/>
        </svg>
        <span class="hidden sm:inline">Homebase</span>
      </a>
      <span class="mx-1 hidden h-6 w-px bg-ink/15 md:block" aria-hidden="true"></span>
      <div id="top-links" class="hidden items-center gap-1 md:flex"></div>
      <span class="mx-1 hidden h-6 w-px bg-ink/15 lg:block" aria-hidden="true"></span>
      <p id="who" class="hidden max-w-[11rem] truncate px-2 text-sm text-muted lg:block"></p>
      <button type="button" id="logout" data-action="logout"
        class="ml-1 min-h-[44px] rounded-full bg-ink px-5 text-sm font-semibold text-white outline-none transition-colors hover:bg-black focus-visible:ring-2 focus-visible:ring-ink focus-visible:ring-offset-2">Log out</button>
    </nav>
  </header>

  <!-- BOTTOM TABS (below md) -->
  <nav aria-label="Dashboard sections" class="fixed inset-x-0 bottom-0 z-40 border-t border-line bg-white md:hidden">
    <div id="bottom-links" class="mx-auto grid max-w-md grid-cols-3 gap-1 p-1.5"></div>
  </nav>

  <main id="main" class="mx-auto w-full max-w-5xl px-4 pb-28 pt-24 sm:px-8 md:pb-16 md:pt-28" tabindex="-1">
    <header>
      <h1 id="page-title" tabindex="-1" class="font-display text-2xl font-bold tracking-tight text-ink outline-none sm:text-3xl">Loading</h1>
      <p id="page-sub" class="mt-1.5 max-w-2xl text-base text-muted"></p>
    </header>
    <div id="view" class="mt-8" aria-busy="true">
      <p class="text-base text-muted">Loading your dashboard from this browser...</p>
    </div>
  </main>

  <!-- status messages -->
  <div id="toast" role="status" aria-live="polite" class="pointer-events-none fixed inset-x-0 bottom-24 z-50 flex justify-center px-4 md:bottom-6"></div>

  <!-- PROPERTY FORM -->
  <dialog id="prop-dialog" aria-labelledby="prop-title" class="w-[calc(100vw-2rem)] max-w-2xl rounded-xl border border-line bg-white p-0 text-ink shadow-xl backdrop:bg-ink/50">
    <form id="prop-form" novalidate class="max-h-[calc(100dvh-2rem)] overflow-y-auto p-5 sm:p-6"></form>
  </dialog>

  <!-- CONFIRM -->
  <dialog id="confirm-dialog" aria-labelledby="confirm-title" class="w-[calc(100vw-2rem)] max-w-sm rounded-xl border border-line bg-white p-0 text-ink shadow-xl backdrop:bg-ink/50">
    <div class="p-6">
      <h2 id="confirm-title" class="h2"></h2>
      <p id="confirm-body" class="mt-2 text-base text-muted"></p>
      <div class="mt-6 grid grid-cols-2 gap-3">
        <button type="button" id="confirm-no" class="btn2">Cancel</button>
        <button type="button" id="confirm-yes" class="btn-danger btn-sm">Confirm</button>
      </div>
    </div>
  </dialog>

  <script>
  (function () {
    'use strict';

    // ---------------------------------------------------------------- constants
    var K = { users: 'homebase_users', current: 'homebase_currentUser', props: 'homebase_properties', reqs: 'homebase_requests', prefs: 'homebase_prefs' };
    var AMENITIES = ['Wi-Fi', 'Own bathroom', 'Kitchen', 'Laundry area', 'Study area', 'Air conditioning', 'Parking'];
    var SAFETY = ['Security guard', 'CCTV', 'Curfew', 'Fenced gate', 'Fire extinguisher', 'Lockable room'];
    var FACTORS = [['budget', 'Budget'], ['commute', 'Commute'], ['amenities', 'Amenities'], ['safety', 'Safety']];
    var WEIGHT = { low: 1, medium: 2, high: 3 };

    // ---------------------------------------------------------------- helpers
    function $(s, r) { return (r || document).querySelector(s); }
    function $$(s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); }
    function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
    function peso(n) { return '₱' + Math.round(n).toLocaleString('en-PH'); }
    function num(v) { var n = Number(String(v == null ? '' : v).replace(/,/g, '').trim()); return isFinite(n) && String(v).trim() !== '' ? n : NaN; }
    function norm(s) { return String(s || '').trim().toLowerCase().replace(/\s+/g, ' '); }
    function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
    function fmtDate(iso) { try { return new Date(iso).toLocaleDateString('en-PH', { month: 'short', day: 'numeric' }); } catch (e) { return ''; } }
    function plural(n, one, many) { return n + ' ' + (n === 1 ? one : many); }

    var toastTimer = null;
    function toast(msg, kind) {
      var box = $('#toast');
      box.innerHTML = '<p class="pointer-events-auto max-w-md rounded-lg px-4 py-3 text-sm font-semibold shadow-lg ' +
        (kind === 'error' ? 'border border-danger bg-[#FEF3F2] text-danger' : 'bg-ink text-white') + '">' + esc(msg) + '</p>';
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function () { box.innerHTML = ''; }, kind === 'error' ? 7000 : 4000);
    }

    // ---------------------------------------------------------------- storage (guarded)
    function read(key, fb) {
      var raw;
      try { raw = localStorage.getItem(key); } catch (e) { throw new Error('This browser is blocking site storage.'); }
      if (!raw) return fb;
      try { return JSON.parse(raw); } catch (e) { throw new Error('Saved data for "' + key + '" is damaged.'); }
    }
    function write(key, val) {
      try { localStorage.setItem(key, JSON.stringify(val)); return true; }
      catch (e) { toast('Could not save. Your browser may be blocking site storage or it is full.', 'error'); return false; }
    }

    // ---------------------------------------------------------------- session
    var user = null, users = [];
    try { user = read(K.current, null); users = read(K.users, []); } catch (e) { user = null; }
    if (!user || !user.email || !users.some(function (u) { return u.email === user.email; })) { location.replace('index.html'); return; }
    var role = user.role === 'landlord' ? 'landlord' : 'student';

    var ROUTES = {
      student: [['matches', 'Matches'], ['requests', 'My requests'], ['prefs', 'Preferences']],
      landlord: [['overview', 'Overview'], ['properties', 'Properties'], ['requests', 'Requests']]
    };
    var state = { showFull: false, openId: null };

    function currentRoute() {
      var h = location.hash.replace('#', '');
      var list = ROUTES[role];
      for (var i = 0; i < list.length; i++) if (list[i][0] === h) return h;
      return list[0][0];
    }

    // ---------------------------------------------------------------- data access
    function getProps() { return read(K.props, []); }
    function getReqs() { return read(K.reqs, []); }
    function getPrefs() { var all = read(K.prefs, {}); return all[user.id] || null; }
    function myProps() { return getProps().filter(function (p) { return p.landlordId === user.id; }); }
    function pendingForMe() {
      var mine = {}; myProps().forEach(function (p) { mine[p.id] = true; });
      return getReqs().filter(function (r) { return mine[r.propertyId] && r.status === 'pending'; });
    }

    // ---------------------------------------------------------------- shared pieces
    // Bed windows: one square per bed, lit = open. The count is always printed next to it.
    function windows(open, total) {
      var shown = Math.min(total, 12), h = '<span class="inline-flex flex-wrap items-center gap-1 rounded-md bg-forest p-1.5" aria-hidden="true">';
      for (var i = 0; i < shown; i++) h += '<span class="h-3.5 w-3.5 rounded-[3px] ' + (i < open ? 'bg-lime' : 'bg-forest-deep') + '"></span>';
      if (total > shown) h += '<span class="px-1 text-xs font-semibold text-white">+' + (total - shown) + '</span>';
      return h + '</span>';
    }
    function bedsText(open, total) { return open + ' of ' + plural(total, 'bed', 'beds') + ' open'; }

    function emptyCard(title, body, actionsHtml) {
      return '<div class="card max-w-xl p-6 sm:p-8"><h2 class="h2">' + esc(title) + '</h2><p class="mt-2 text-base text-muted">' + body + '</p>' +
        (actionsHtml ? '<div class="mt-6 flex flex-wrap gap-3">' + actionsHtml + '</div>' : '') + '</div>';
    }

    function statusLabel(s) {
      var map = {
        pending: ['Waiting for landlord', 'border border-line bg-tint text-ink'],
        approved: ['Approved', 'bg-forest text-white'],
        declined: ['Declined', 'border border-danger bg-[#FEF3F2] text-danger'],
        cancelled: ['Cancelled by you', 'border border-line bg-white text-muted']
      };
      var m = map[s] || map.pending;
      return '<span class="inline-flex min-h-[28px] items-center rounded-md px-2.5 text-sm font-semibold ' + m[1] + '">' + m[0] + '</span>';
    }

    function checkGroup(name, items, selected) {
      return '<div class="grid gap-2 sm:grid-cols-2">' + items.map(function (it, i) {
        return '<label class="flex min-h-[44px] cursor-pointer items-center gap-3 rounded-lg border border-line px-3 text-base transition-colors hover:border-[#8FA397] has-[:checked]:border-forest has-[:checked]:bg-tint has-[:focus-visible]:ring-2 has-[:focus-visible]:ring-forest">' +
          '<input type="checkbox" name="' + name + '" value="' + esc(it) + '"' + (selected.indexOf(it) > -1 ? ' checked' : '') + ' class="h-5 w-5 shrink-0 accent-forest"><span>' + esc(it) + '</span></label>';
      }).join('') + '</div>';
    }

    // ---------------------------------------------------------------- scoring (student)
    function computeMatches(props, prefs) {
      var w = { budget: WEIGHT[prefs.pri.budget] || 2, commute: WEIGHT[prefs.pri.commute] || 2, amenities: WEIGHT[prefs.pri.amenities] || 2, safety: WEIGHT[prefs.pri.safety] || 2 };
      var wsum = w.budget + w.commute + w.amenities + w.safety, out = [];
      props.forEach(function (p) {
        var c = (p.commutes || []).filter(function (x) { return norm(x.school) === norm(prefs.school); })[0];
        (p.rooms || []).forEach(function (room) {
          var rent = room.price, util = p.utilitiesIncluded ? 0 : (p.utilities || 0), trip = c ? c.fare * 2 * prefs.days : 0, total = rent + util + trip;
          var s = {};
          s.budget = total <= prefs.budget ? 100 : Math.max(0, Math.round(100 - ((total - prefs.budget) / prefs.budget) * 200));
          s.commute = !c ? 0 : (c.km <= prefs.maxKm ? 100 : Math.max(0, Math.round(100 - ((c.km - prefs.maxKm) / prefs.maxKm) * 100)));
          var missA = prefs.amenities.filter(function (a) { return (p.amenities || []).indexOf(a) < 0; });
          var missS = prefs.safety.filter(function (a) { return (p.safety || []).indexOf(a) < 0; });
          s.amenities = prefs.amenities.length ? Math.round((prefs.amenities.length - missA.length) / prefs.amenities.length * 100) : 100;
          s.safety = prefs.safety.length ? Math.round((prefs.safety.length - missS.length) / prefs.safety.length * 100) : 100;
          var score = Math.round((s.budget * w.budget + s.commute * w.commute + s.amenities * w.amenities + s.safety * w.safety) / wsum);
          var notes = [];
          if (total > prefs.budget) notes.push(peso(total - prefs.budget) + ' over your monthly budget');
          if (!c) notes.push('The landlord has not listed a distance to ' + prefs.school);
          else if (c.km > prefs.maxKm) notes.push((Math.round((c.km - prefs.maxKm) * 10) / 10) + ' km farther than your limit');
          if (missA.length) notes.push('Missing amenities: ' + missA.join(', '));
          if (missS.length) notes.push('Missing safety features: ' + missS.join(', '));
          out.push({ prop: p, room: room, cost: { rent: rent, util: util, trip: trip, total: total, known: !!c, fare: c ? c.fare : 0 }, s: s, score: score, notes: notes, km: c ? c.km : null });
        });
      });
      out.sort(function (a, b) { return b.score - a.score || a.cost.total - b.cost.total; });
      return out;
    }
    function fitLabel(score) { return score >= 80 ? 'Strong fit' : (score >= 60 ? 'Fair fit' : 'Weak fit'); }

    function bars(m) {
      return '<div class="space-y-2.5">' + FACTORS.map(function (f) {
        var v = m.s[f[0]];
        return '<div class="grid grid-cols-[5.5rem_minmax(0,1fr)_2rem] items-center gap-3 text-sm"><span class="text-muted">' + f[1] + '</span>' +
          '<span class="h-2 rounded-full bg-track"><span class="block h-2 rounded-full bg-forest" style="width:' + v + '%"></span></span>' +
          '<span class="text-right font-semibold tabular-nums">' + v + '</span></div>';
      }).join('') + '</div>';
    }
    function costLine(m) {
      var c = m.cost, parts = ['Rent ' + peso(c.rent)];
      parts.push(m.prop.utilitiesIncluded ? 'utilities included' : 'utilities ' + peso(c.util));
      parts.push(c.known ? 'commute ' + peso(c.trip) : 'commute cost unknown');
      return parts.join(' + ');
    }
    function requestState(roomId) {
      var list = getReqs().filter(function (r) { return r.roomId === roomId && r.studentId === user.id && (r.status === 'pending' || r.status === 'approved'); });
      return list[0] || null;
    }
    function requestBlock(m) {
      var r = requestState(m.room.id), id = esc(m.room.id);
      if (r) return '<p data-fk="status-' + id + '" tabindex="-1" class="mt-4 rounded-lg bg-tint px-3.5 py-3 text-base font-semibold outline-none">' +
        (r.status === 'approved' ? 'Approved. A bed is held for you in this room.' : 'Request sent. Waiting for the landlord to answer.') + '</p>';
      if (m.room.bedsOpen < 1) return '<p class="mt-4 text-base font-semibold text-muted">No open beds right now.</p>';
      return '<button type="button" class="btn mt-4 w-full sm:w-auto" data-action="request" data-prop="' + esc(m.prop.id) + '" data-room="' + id + '" data-fk="req-' + id + '">Request this room</button>';
    }
    function whyList(m) {
      return m.notes.length
        ? '<ul class="mt-4 space-y-1 text-sm text-muted">' + m.notes.map(function (n) { return '<li>' + esc(n) + '</li>'; }).join('') + '</ul>'
        : '<p class="mt-4 text-sm font-semibold text-forest">Meets everything you asked for.</p>';
    }
    function sampleTag(p) { return p.sample ? '<span class="ml-2 inline-flex rounded border border-line bg-tint px-1.5 text-xs font-semibold text-muted">Sample</span>' : ''; }
    function roomMeta(m) {
      return esc(m.room.label) + ' · ' + esc(m.room.type) + (m.km != null ? ' · ' + m.km + ' km to ' : '') + (m.km != null ? '' : '');
    }

    function bigCard(m, prefs) {
      return '<article class="card border-forest p-5 sm:p-6" aria-labelledby="best-title">' +
        '<p class="text-sm font-semibold text-forest">Best match for you</p>' +
        '<div class="mt-3 grid gap-5 sm:grid-cols-[auto_minmax(0,1fr)]">' +
          '<div class="flex h-28 w-28 flex-col items-center justify-center rounded-xl bg-forest text-lime" aria-label="Match score ' + m.score + ' out of 100"><span class="font-display text-5xl font-bold leading-none">' + m.score + '</span><span class="mt-1.5 text-xs font-semibold text-white">of 100 · ' + fitLabel(m.score) + '</span></div>' +
          '<div class="min-w-0"><h2 id="best-title" class="font-display text-xl font-bold tracking-tight">' + esc(m.prop.name) + sampleTag(m.prop) + '</h2>' +
          '<p class="mt-1 text-base text-muted">' + esc(m.prop.area) + '</p>' +
          '<p class="mt-2 text-base font-semibold">' + esc(m.room.label) + ' · ' + esc(m.room.type) + '</p>' +
          '<p class="mt-3 font-display text-3xl font-bold tracking-tight">' + peso(m.cost.total) + '<span class="ml-1.5 text-base font-semibold text-muted">per month, all in</span></p>' +
          '<p class="mt-1 text-sm text-muted">' + esc(costLine(m)) + '</p>' +
          '<p class="mt-3 flex flex-wrap items-center gap-2.5 text-sm font-semibold">' + windows(m.room.bedsOpen, m.room.bedsTotal) + '<span>' + bedsText(m.room.bedsOpen, m.room.bedsTotal) + '</span></p></div>' +
        '</div>' +
        '<div class="mt-5 border-t border-line pt-5">' + bars(m) + whyList(m) + requestBlock(m) + '</div></article>';
    }

    function rowCard(m) {
      var full = m.room.bedsOpen < 1, open = state.openId === m.room.id ? ' open' : '';
      return '<details class="card group"' + open + '>' +
        '<summary class="flex min-h-[64px] cursor-pointer list-none items-center gap-3 rounded-xl p-3 outline-none hover:bg-tint focus-visible:ring-2 focus-visible:ring-forest [&::-webkit-details-marker]:hidden" data-fk="sum-' + esc(m.room.id) + '">' +
          '<span class="flex h-12 w-12 shrink-0 flex-col items-center justify-center rounded-lg bg-forest text-lime" aria-label="Score ' + m.score + '"><span class="font-display text-lg font-bold leading-none">' + m.score + '</span></span>' +
          '<span class="min-w-0 flex-1"><span class="block truncate text-base font-semibold">' + esc(m.prop.name) + sampleTag(m.prop) + '</span>' +

        }

      h += '</div><p class="mt-6 max-w-2xl text-sm text-muted">Listing details are typed in by landlords and are not verified by Homebase yet. Commute cost assumes two trips a day on the days you set in Preferences.</p>';

    function vStudentRequests() {
      var sub = 'Rooms you asked for and what the landlord answered.';

      if (!mine.length) return { title: 'My requests', sub: sub, html: emptyCard('You have not requested a room yet', 'When you request a room from your matches, it shows up here with the landlord\'s answer.', '<a class="btn" href="#matches">See my matches</a>') };

    function vPrefs() {
      var p = getPrefs(), first = !p;

            '<p class="hint" id="pf-school-hint">Type it the way landlords list it. Distances are matched by this name.</p></div>' +
          '<div class="grid gap-4 sm:grid-cols-3">' +
            '<div><label class="label" for="pf-budget">Monthly budget (₱)</label><input class="field" id="pf-budget" name="budget" type="number" inputmode="numeric" min="1" step="50" value="' + esc(p.budget) + '" aria-describedby="pf-budget-hint"><p class="hint" id="pf-budget-hint">Rent, utilities and commute together.</p></div>' +
            '<div><label class="label" for="pf-km">Farthest from school (km)</label><input class="field" id="pf-km" name="maxKm" type="number" inputmode="decimal" min="0.1" step="0.1" value="' + esc(p.maxKm) + '"></div>' +
            '<div><label class="label" for="pf-days">School days a month</label><input class="field" id="pf-days" name="days" type="number" inputmode="numeric" min="1" max="31" step="1" value="' + esc(p.days) + '" aria-describedby="pf-days-hint"><p class="hint" id="pf-days-hint">Used for commute cost. Change it if yours differs.</p></div>' +
          '</div></section>' +
        '<fieldset class="space-y-3"><legend class="h2">Amenities you need</legend><p class="hint !mt-0">Pick only the ones you would not do without.</p>' + checkGroup('amenity', AMENITIES, p.amenities) + '</fieldset>' +
        '<fieldset class="space-y-3"><legend class="h2">Safety you need</legend>' + checkGroup('safety', SAFETY, p.safety) + '</fieldset>' +
        '<section aria-labelledby="p4" class="space-y-4"><h2 id="p4" class="h2">What matters most</h2><p class="hint !mt-0">This sets how much each part counts toward the score.</p>' +

    // ---------------------------------------------------------------- VIEWS: landlord
    function reqCard(r, withActions) {
      return '<li class="card p-4 sm:p-5"><div class="flex flex-wrap items-start justify-between gap-3"><div class="min-w-0"><p class="text-base font-semibold">' + esc(r.studentName) + '</p>' +
        '<p class="mt-0.5 text-sm"><a class="font-medium text-forest underline underline-offset-4" href="mailto:' + esc(r.studentEmail) + '">' + esc(r.studentEmail) + '</a></p>' +
        '<p class="mt-2 text-sm text-muted">Wants ' + esc(r.roomLabel) + ' at ' + esc(r.propertyName) + ' · asked ' + esc(fmtDate(r.createdAt)) + '</p></div>' +

    function vOverview() {
      var sub = 'Who is waiting on you, and which beds are open.';
      var props = myProps();
      if (!props.length) return { title: 'Overview', sub: sub, html: emptyCard('You have not added a property yet', 'Add your dorm or apartment with its rooms, beds and the schools it is near. Students whose budget and commute fit will then see it in their matches.', '<button type="button" class="btn" data-action="add-property" data-fk="add-property">Add my first property</button>') };
      var open = 0, total = 0, rooms = 0;

          var o = 0, t = 0; p.rooms.forEach(function (r) { o += r.bedsOpen; t += r.bedsTotal; });
          return '<li class="card p-4"><div class="flex flex-wrap items-center justify-between gap-2"><p class="text-base font-semibold">' + esc(p.name) + '</p><p class="text-sm font-semibold text-muted">' + bedsText(o, t) + '</p></div><div class="mt-3">' + windows(o, t) + '</div></li>';
        }).join('') + '</ul><a class="linkbtn mt-3" href="#properties">Edit beds and rooms</a></section>' +
        '<section aria-labelledby="ov-req"><h2 id="ov-req" data-fk="pending-heading" tabindex="-1" class="h2 outline-none">Waiting for your answer</h2>' +

        '</section></div>';

    function vProperties() {
      var sub = 'Keep rooms and open beds true. Students see changes right away.';

      if (!props.length) return { title: 'Properties', sub: sub, html: emptyCard('You have not added a property yet', 'Add your dorm or apartment with its rooms, beds and the schools it is near.', '<button type="button" class="btn" data-action="add-property" data-fk="add-property">Add my first property</button>') };
      return { title: 'Properties', sub: sub, html: head + '<ul class="space-y-6">' + props.map(function (p) {
        return '<li class="card p-5 sm:p-6"><div class="flex flex-wrap items-start justify-between gap-3"><div class="min-w-0"><h2 class="font-display text-xl font-bold tracking-tight">' + esc(p.name) + '</h2><p class="mt-1 text-base text-muted">' + esc(p.area) + '</p></div>' +
          '<div class="flex flex-wrap gap-3"><button type="button" class="btn2" data-action="edit-property" data-id="' + esc(p.id) + '" data-fk="edit-' + esc(p.id) + '">Edit</button><button type="button" class="btn-danger" data-action="delete-property" data-id="' + esc(p.id) + '">Delete</button></div></div>' +
          '<dl class="mt-4 grid gap-x-8 gap-y-2 text-sm sm:grid-cols-2">' +
            '<div><dt class="font-semibold">Near</dt><dd class="text-muted">' + p.commutes.map(function (c) { return esc(c.school) + ', ' + c.km + ' km' + (c.fare ? ', ' + peso(c.fare) + ' one way' : ', no fare'); }).join('<br>') + '</dd></div>' +
            '<div><dt class="font-semibold">Utilities</dt><dd class="text-muted">' + (p.utilitiesIncluded ? 'Included in rent' : peso(p.utilities || 0) + ' a month on top of rent') + '</dd></div>' +

          '<div class="mt-5 border-t border-line pt-4"><h3 class="text-base font-semibold">Rooms</h3><ul class="mt-3 divide-y divide-line">' + p.rooms.map(function (r) {

    function vLandlordRequests() {
      var sub = 'Approving a request holds one bed in that room.';

      var all = getReqs().filter(function (r) { return mine[r.propertyId]; }).sort(function (a, b) { return a.createdAt < b.createdAt ? 1 : -1; });
      if (!all.length) return { title: 'Requests', sub: sub, html: emptyCard('No requests yet', myProps().length ? 'When a student requests one of your rooms, it appears here for you to approve or decline.' : 'Requests come from students who find your rooms in their matches. Add a property first so there is something to request.', myProps().length ? '' : '<button type="button" class="btn" data-action="add-property" data-fk="add-property">Add a property</button>') };
      var pend = all.filter(function (r) { return r.status === 'pending'; }), done = all.filter(function (r) { return r.status !== 'pending'; });

    var VIEWS = {

      landlord: { overview: vOverview, properties: vProperties, requests: vLandlordRequests }
    };

    // ---------------------------------------------------------------- render
    function renderNav() {
      var r = currentRoute(), pend = 0;
      try { if (role === 'landlord') pend = pendingForMe().length; } catch (e) {}
      var links = ROUTES[role].map(function (x) {
        var count = (role === 'landlord' && x[0] === 'requests' && pend > 0) ? '<span class="inline-flex h-6 min-w-[24px] items-center justify-center rounded-[4px] bg-lime px-1.5 text-xs font-bold text-forest" aria-label="' + plural(pend, 'request', 'requests') + ' waiting">' + pend + '</span>' : '';
        return '<a class="navlink" href="#' + x[0] + '"' + (x[0] === r ? ' aria-current="page"' : '') + '>' + esc(x[1]) + count + '</a>';
      }).join('');
      $('#top-links').innerHTML = links;
      $('#bottom-links').innerHTML = links;
      $('#logo').setAttribute('href', '#' + ROUTES[role][0][0]);
      $('#who').textContent = user.name;
      $('#who').title = user.name + ' (' + role + ')';
    }

    function errorView(e) {
      return emptyCard('Your saved data could not be read', esc(e && e.message ? e.message : 'Something went wrong reading this browser\'s storage.') + ' Try again first. If it keeps failing, you can clear the listings, requests and preferences saved here (your account stays).',
        '<button type="button" class="btn" data-action="retry" data-fk="retry">Try again</button><button type="button" class="btn-danger" data-action="reset-data">Clear dashboard data</button>');
    }

    function render(focusKey) {
      var view = $('#view');
      try {
        renderNav();
        var out = VIEWS[role][currentRoute()]();
        $('#page-title').textContent = out.title;
        $('#page-sub').textContent = out.sub || '';
        view.innerHTML = out.html;
        document.title = 'Homebase | ' + out.title;
      } catch (e) {
        $('#page-title').textContent = 'Something went wrong';
        $('#page-sub').textContent = '';
        view.innerHTML = errorView(e);
        document.title = 'Homebase | Error';
      }
      view.setAttribute('aria-busy', 'false');
      if (focusKey) { var el = document.querySelector('[data-fk="' + focusKey + '"]'); if (el) el.focus(); }
    }

    // ---------------------------------------------------------------- dialogs
    function confirmDialog(title, body, yes) {
      return new Promise(function (resolve) {
        var d = $('#confirm-dialog');
        $('#confirm-title').textContent = title; $('#confirm-body').textContent = body; $('#confirm-yes').textContent = yes || 'Confirm';
        function done(v) { d.removeEventListener('close', onClose); $('#confirm-yes').onclick = null; $('#confirm-no').onclick = null; if (d.open) d.close(); resolve(v); }
        function onClose() { done(false); }
        d.addEventListener('close', onClose);
        $('#confirm-yes').onclick = function () { done(true); };
        $('#confirm-no').onclick = function () { done(false); };
        d.showModal();
      });
    }

    // property form ------------------------------------------------------
    function roomRow(r) {
      r = r || { id: uid(), label: '', type: 'Shared', price: '', bedsTotal: '', bedsOpen: '' };
      var i = esc(r.id);
      return '<fieldset class="rounded-lg border border-line p-3 sm:p-4" data-row="room" data-id="' + i + '"><legend class="px-1 text-sm font-semibold">Room</legend>' +
        '<div class="grid gap-3 sm:grid-cols-2"><div><label class="label" for="rl-' + i + '">Room name</label><input class="field js-label" id="rl-' + i + '" value="' + esc(r.label) + '" placeholder="Room 1"></div>' +
        '<div><label class="label" for="rt-' + i + '">Type</label><select class="field js-type" id="rt-' + i + '"><option' + (r.type === 'Shared' ? ' selected' : '') + '>Shared</option><option' + (r.type === 'Single' ? ' selected' : '') + '>Single</option></select></div>' +
        '<div><label class="label" for="rp-' + i + '">Rent per bed (₱ a month)</label><input class="field js-price" id="rp-' + i + '" type="number" inputmode="numeric" min="1" value="' + esc(r.price) + '"></div>' +
        '<div class="grid grid-cols-2 gap-3"><div><label class="label" for="rb-' + i + '">Total beds</label><input class="field js-total" id="rb-' + i + '" type="number" inputmode="numeric" min="1" value="' + esc(r.bedsTotal) + '"></div>' +
        '<div><label class="label" for="ro-' + i + '">Beds open</label><input class="field js-open" id="ro-' + i + '" type="number" inputmode="numeric" min="0" value="' + esc(r.bedsOpen) + '"></div></div></div>' +
        '<button type="button" class="btn-danger mt-3" data-action="remove-row">Remove this room</button></fieldset>';
    }
    function commuteRow(c) {
      c = c || { school: '', km: '', fare: '' };
      var i = uid();
      return '<fieldset class="rounded-lg border border-line p-3 sm:p-4" data-row="commute"><legend class="px-1 text-sm font-semibold">School</legend>' +
        '<div class="grid gap-3 sm:grid-cols-3"><div class="sm:col-span-3"><label class="label" for="cs-' + i + '">School name</label><input class="field js-school" id="cs-' + i + '" value="' + esc(c.school) + '"></div>' +
        '<div><label class="label" for="ck-' + i + '">Distance (km)</label><input class="field js-km" id="ck-' + i + '" type="number" inputmode="decimal" min="0" step="0.1" value="' + esc(c.km) + '"></div>' +
        '<div><label class="label" for="cf-' + i + '">One-way fare (₱)</label><input class="field js-fare" id="cf-' + i + '" type="number" inputmode="numeric" min="0" value="' + esc(c.fare) + '" aria-describedby="cf-h-' + i + '"><p class="hint" id="cf-h-' + i + '">Use 0 if students walk.</p></div></div>' +
        '<button type="button" class="btn-danger mt-3" data-action="remove-row">Remove this school</button></fieldset>';
    }
    function openPropForm(id) {
      var p = id ? myProps().filter(function (x) { return x.id === id; })[0] : null;
      p = p || { id: null, name: '', area: '', utilities: '', utilitiesIncluded: false, amenities: [], safety: [], commutes: [{ school: '', km: '', fare: '' }], rooms: [null] };
      $('#prop-form').dataset.id = p.id || '';
      $('#prop-form').innerHTML =
        '<h2 id="prop-title" class="h2">' + (p.id ? 'Edit property' : 'Add a property') + '</h2>' +
        '<div id="prop-error" role="alert" tabindex="-1" class="err hidden rounded-lg border border-danger/30 bg-[#FEF3F2] px-3.5 py-3 outline-none"></div>' +
        '<div class="mt-5 space-y-6">' +
        '<div class="grid gap-4 sm:grid-cols-2"><div><label class="label" for="pr-name">Property name</label><input class="field" id="pr-name" value="' + esc(p.name) + '" autocomplete="off"></div>' +
          '<div><label class="label" for="pr-area">Area or address</label><input class="field" id="pr-area" value="' + esc(p.area) + '" autocomplete="off"></div></div>' +
        '<fieldset class="space-y-3"><legend class="text-base font-semibold">Utilities</legend><label class="flex min-h-[44px] cursor-pointer items-center gap-3 text-base"><input type="checkbox" id="pr-util-inc" class="h-5 w-5 accent-forest"' + (p.utilitiesIncluded ? ' checked' : '') + '> Utilities are included in the rent</label>' +
          '<div><label class="label" for="pr-util">Utilities on top of rent (₱ a month, per student)</label><input class="field max-w-xs" id="pr-util" type="number" inputmode="numeric" min="0" value="' + esc(p.utilities) + '"></div></fieldset>' +
        '<fieldset class="space-y-3"><legend class="text-base font-semibold">Schools nearby</legend><p class="hint !mt-0">Students are matched by school name, so spell it the way students do.</p><div id="commutes-list" class="space-y-3">' + p.commutes.map(commuteRow).join('') + '</div><button type="button" class="btn2" data-action="add-commute">Add another school</button></fieldset>' +
        '<fieldset class="space-y-3"><legend class="text-base font-semibold">Amenities</legend>' + checkGroup('pr-amenity', AMENITIES, p.amenities) + '</fieldset>' +
        '<fieldset class="space-y-3"><legend class="text-base font-semibold">Safety</legend>' + checkGroup('pr-safety', SAFETY, p.safety) + '</fieldset>' +
        '<fieldset class="space-y-3"><legend class="text-base font-semibold">Rooms</legend><div id="rooms-list" class="space-y-3">' + p.rooms.map(roomRow).join('') + '</div><button type="button" class="btn2" data-action="add-room">Add another room</button></fieldset>' +
        '</div><div class="mt-6 grid grid-cols-2 gap-3 border-t border-line pt-5"><button type="button" class="btn2 btn-sm" data-action="close-prop">Cancel</button><button type="submit" class="btn btn-sm">' + (p.id ? 'Save changes' : 'Add property') + '</button></div>';
      var d = $('#prop-dialog'); d.showModal(); $('#prop-form').scrollTop = 0;
    }

    function submitProp(e) {
      e.preventDefault();
      var form = $('#prop-form'), errs = [], bad = [];
      $$('[aria-invalid]', form).forEach(function (x) { x.removeAttribute('aria-invalid'); });
      function flag(el, msg) { if (el) { el.setAttribute('aria-invalid', 'true'); bad.push(el); } errs.push(msg); }
      var name = $('#pr-name').value.trim(), area = $('#pr-area').value.trim();
      if (!name) flag($('#pr-name'), 'Enter the property name.');
      if (!area) flag($('#pr-area'), 'Enter the area or address.');
      var incl = $('#pr-util-inc').checked, utilRaw = $('#pr-util').value, util = utilRaw === '' ? 0 : num(utilRaw);
      if (!incl && (isNaN(util) || util < 0)) flag($('#pr-util'), 'Utilities must be 0 or more. Tick "included" if there is no extra charge.');
      var commutes = [];
      $$('[data-row=commute]', form).forEach(function (row) {
        var s = $('.js-school', row), k = $('.js-km', row), f = $('.js-fare', row);
        var sv = s.value.trim(), kv = num(k.value), fv = f.value === '' ? NaN : num(f.value);
        if (!sv) flag(s, 'Every school row needs a school name.');
        if (isNaN(kv) || kv < 0) flag(k, 'Enter the distance in km for ' + (sv || 'each school') + '.');
        if (isNaN(fv) || fv < 0) flag(f, 'Enter the one-way fare for ' + (sv || 'each school') + ' (0 if students walk).');
        if (sv && !isNaN(kv) && !isNaN(fv) && kv >= 0 && fv >= 0) commutes.push({ school: sv, km: kv, fare: fv });
      });
      if (!$$('[data-row=commute]', form).length) flag($('[data-action=add-commute]', form), 'Add at least one school. Matching needs a distance to a school.');
      var rooms = [];
      $$('[data-row=room]', form).forEach(function (row) {
        var l = $('.js-label', row), pr = $('.js-price', row), t = $('.js-total', row), o = $('.js-open', row);
        var lv = l.value.trim(), pv = num(pr.value), tv = num(t.value), ov = num(o.value);
        if (!lv) flag(l, 'Every room needs a name.');
        if (isNaN(pv) || pv <= 0) flag(pr, 'Enter the rent per bed for ' + (lv || 'each room') + '.');
        if (isNaN(tv) || tv < 1 || Math.floor(tv) !== tv) flag(t, 'Total beds in ' + (lv || 'each room') + ' must be a whole number, at least 1.');
        else if (isNaN(ov) || ov < 0 || ov > tv || Math.floor(ov) !== ov) flag(o, 'Beds open in ' + (lv || 'each room') + ' must be a whole number from 0 to ' + tv + '.');
        if (lv && pv > 0 && tv >= 1 && ov >= 0 && ov <= tv) rooms.push({ id: row.dataset.id, label: lv, type: $('.js-type', row).value, price: pv, bedsTotal: tv, bedsOpen: ov });
      });
      if (!$$('[data-row=room]', form).length) flag($('[data-action=add-room]', form), 'Add at least one room.');
      if (errs.length) {
        var box = $('#prop-error');
        box.innerHTML = '<p class="font-semibold">Fix these and try again:</p><ul class="mt-1 list-disc space-y-0.5 pl-5 font-normal">' + errs.map(function (m) { return '<li>' + esc(m) + '</li>'; }).join('') + '</ul>';
        box.classList.remove('hidden'); box.focus(); box.scrollIntoView({ block: 'nearest' });
        return;
      }
      var id = form.dataset.id, props;
      try { props = getProps(); } catch (er) { toast(er.message, 'error'); return; }
      var rec = {
        id: id || uid(), landlordId: user.id, name: name, area: area, utilitiesIncluded: incl, utilities: incl ? 0 : util,
        amenities: $$('input[name=pr-amenity]:checked', form).map(function (x) { return x.value; }),
        safety: $$('input[name=pr-safety]:checked', form).map(function (x) { return x.value; }),
        commutes: commutes, rooms: rooms
      };
      var idx = -1; props.forEach(function (p, i) { if (p.id === rec.id && p.landlordId === user.id) idx = i; });
      if (idx > -1) { rec.createdAt = props[idx].createdAt; props[idx] = rec; } else { rec.createdAt = new Date().toISOString(); props.push(rec); }
      if (!write(K.props, props)) return;
      $('#prop-dialog').close();
      toast(idx > -1 ? 'Property saved.' : 'Property added. Students can now find it.');
      location.hash = '#properties'; render();
    }

    // prefs form ---------------------------------------------------------
    function submitPrefs(e) {
      e.preventDefault();
      var f = e.target, errs = [], bad = [];
      function flag(el, m) { el.setAttribute('aria-invalid', 'true'); bad.push(el); errs.push(m); }
      $$('[aria-invalid]', f).forEach(function (x) { x.removeAttribute('aria-invalid'); });
      var school = $('#pf-school').value.trim(), budget = num($('#pf-budget').value), km = num($('#pf-km').value), days = num($('#pf-days').value);
      if (!school) flag($('#pf-school'), 'Enter your school.');
      if (isNaN(budget) || budget <= 0) flag($('#pf-budget'), 'Enter a monthly budget above 0.');
      if (isNaN(km) || km <= 0) flag($('#pf-km'), 'Enter how far from school you can live, in km.');
      if (isNaN(days) || days < 1 || days > 31 || Math.floor(days) !== days) flag($('#pf-days'), 'School days a month must be a whole number from 1 to 31.');
      var box = $('#prefs-error');
      if (errs.length) { box.innerHTML = errs.map(function (m) { return esc(m); }).join('<br>'); box.classList.remove('hidden'); bad[0].focus(); return; }
      box.classList.add('hidden');
      var all; try { all = read(K.prefs, {}); } catch (er) { toast(er.message, 'error'); return; }
      all[user.id] = {
        school: school, budget: budget, maxKm: km, days: days,
        amenities: $$('input[name=amenity]:checked', f).map(function (x) { return x.value; }),
        safety: $$('input[name=safety]:checked', f).map(function (x) { return x.value; }),
        pri: { budget: $('#pri-budget').value, commute: $('#pri-commute').value, amenities: $('#pri-amenities').value, safety: $('#pri-safety').value }
      };
      if (!write(K.prefs, all)) return;
      toast('Preferences saved.');
      if (location.hash === '#matches') render(); else location.hash = '#matches';
    }

    // ---------------------------------------------------------------- actions
    var actions = {
      logout: function () { try { localStorage.removeItem(K.current); } catch (e) {} location.href = 'index.html'; },
      retry: function () { render('retry'); },
      'reset-data': function () {
        confirmDialog('Clear dashboard data?', 'This removes all listings, requests and preferences saved in this browser. Your account stays.', 'Clear data').then(function (ok) {
          if (!ok) return;
          try { localStorage.removeItem(K.props); localStorage.removeItem(K.reqs); localStorage.removeItem(K.prefs); } catch (e) { toast('Could not clear data.', 'error'); return; }
          toast('Dashboard data cleared.'); render();
        });
      },
      'load-sample': function () {
        var prefs; try { prefs = getPrefs(); } catch (e) { return render(); }
        var props = getProps().filter(function (p) { return !p.sample; });
        if (!write(K.props, props.concat(sampleProps(prefs ? prefs.school : 'Sample University')))) return;
        toast('Sample listings loaded. They are marked "Sample".'); render('toggle-full-box');
      },
      'remove-sample': function () {
        confirmDialog('Remove sample listings?', 'The sample rooms and any requests you made on them will be removed. Real listings stay.', 'Remove').then(function (ok) {
          if (!ok) return;
          var props = getProps().filter(function (p) { return !p.sample; });
          var reqs = getReqs().filter(function (r) { return String(r.propertyId).indexOf('sample-') !== 0; });
          if (write(K.props, props) && write(K.reqs, reqs)) { toast('Sample listings removed.'); render(); }
        });
      },
      'toggle-full': function () { state.showFull = true; render('toggle-full-box'); },
      request: function (t) {
        var reqs = getReqs(), prop = getProps().filter(function (p) { return p.id === t.dataset.prop; })[0];
        var room = prop && prop.rooms.filter(function (r) { return r.id === t.dataset.room; })[0];
        if (!room) { toast('That room is no longer listed.', 'error'); return render(); }
        if (room.bedsOpen < 1) { toast('That room just filled up.', 'error'); return render(); }
        if (reqs.some(function (r) { return r.roomId === room.id && r.studentId === user.id && (r.status === 'pending' || r.status === 'approved'); })) { toast('You already asked for this room.', 'error'); return render(); }
        reqs.push({ id: uid(), propertyId: prop.id, propertyName: prop.name, roomId: room.id, roomLabel: room.label, studentId: user.id, studentName: user.name, studentEmail: user.email, status: 'pending', createdAt: new Date().toISOString() });
        if (!write(K.reqs, reqs)) return;
        state.openId = room.id; toast('Request sent to the landlord.'); render('status-' + room.id);
      },
      'cancel-request': function (t) {
        var reqs = getReqs(), r = reqs.filter(function (x) { return x.id === t.dataset.id && x.studentId === user.id; })[0];
        if (!r || r.status !== 'pending') return render();
        r.status = 'cancelled'; r.updatedAt = new Date().toISOString();
        if (write(K.reqs, reqs)) { toast('Request cancelled.'); render(); $('#page-title').focus(); }
      },
      'add-property': function () { openPropForm(null); },
      'edit-property': function (t) { openPropForm(t.dataset.id); },
      'delete-property': function (t) {
        var p = myProps().filter(function (x) { return x.id === t.dataset.id; })[0]; if (!p) return;
        confirmDialog('Delete ' + p.name + '?', 'The property, its rooms and any requests for it will be removed. This cannot be undone.', 'Delete').then(function (ok) {
          if (!ok) return;
          var props = getProps().filter(function (x) { return x.id !== p.id; }), reqs = getReqs().filter(function (r) { return r.propertyId !== p.id; });
          if (write(K.props, props) && write(K.reqs, reqs)) { toast('Property deleted.'); render(); $('#page-title').focus(); }
        });
      },
      bed: function (t) {
        var props = getProps(), p = props.filter(function (x) { return x.id === t.dataset.prop && x.landlordId === user.id; })[0];
        var r = p && p.rooms.filter(function (x) { return x.id === t.dataset.room; })[0]; if (!r) return render();
        var next = r.bedsOpen + Number(t.dataset.delta);
        if (next < 0) { toast('No open beds to remove in ' + r.label + '.', 'error'); return; }
        if (next > r.bedsTotal) { toast(r.label + ' only has ' + plural(r.bedsTotal, 'bed', 'beds') + '. Edit the room to add beds.', 'error'); return; }
        r.bedsOpen = next;
        if (write(K.props, props)) render(t.dataset.fk);
      },
      approve: function (t) {
        var reqs = getReqs(), props = getProps(), r = reqs.filter(function (x) { return x.id === t.dataset.id; })[0]; if (!r || r.status !== 'pending') return render();
        var p = props.filter(function (x) { return x.id === r.propertyId && x.landlordId === user.id; })[0];
        var room = p && p.rooms.filter(function (x) { return x.id === r.roomId; })[0];
        if (!room) { toast('That room no longer exists. Decline this request.', 'error'); return; }
        if (room.bedsOpen < 1) { toast('No open beds left in ' + room.label + '. Add a bed on the Properties page, or decline.', 'error'); return; }
        room.bedsOpen -= 1; r.status = 'approved'; r.updatedAt = new Date().toISOString();
        if (write(K.props, props) && write(K.reqs, reqs)) { toast('Approved. One bed is now held for ' + r.studentName + '.'); render('pending-heading'); }
      },
      decline: function (t) {
        var reqs = getReqs(), r = reqs.filter(function (x) { return x.id === t.dataset.id; })[0]; if (!r || r.status !== 'pending') return render();
        r.status = 'declined'; r.updatedAt = new Date().toISOString();
        if (write(K.reqs, reqs)) { toast('Request declined.'); render('pending-heading'); }
      },
      'add-room': function () { var l = $('#rooms-list'); l.insertAdjacentHTML('beforeend', roomRow()); $('.js-label', l.lastElementChild).focus(); },
      'add-commute': function () { var l = $('#commutes-list'); l.insertAdjacentHTML('beforeend', commuteRow()); $('.js-school', l.lastElementChild).focus(); },
      'remove-row': function (t) { var row = t.closest('[data-row]'), list = row.parentElement; row.remove(); var f = $('input', list); if (f) f.focus(); else $('[data-action^=add-]', list.parentElement).focus(); },
      'close-prop': function () { $('#prop-dialog').close(); }
    };

    document.addEventListener('click', function (e) {
      var t = e.target.closest('[data-action]');
      if (!t || !actions[t.dataset.action]) return;
      try { actions[t.dataset.action](t, e); } catch (err) { toast(err && err.message ? err.message : 'Something went wrong.', 'error'); render(); }
    });
    document.addEventListener('change', function (e) {
      if (e.target.id === 'toggle-full-box') { state.showFull = e.target.checked; render('toggle-full-box'); }
    });
    document.addEventListener('submit', function (e) {
      if (e.target.id === 'prop-form') submitProp(e);
      else if (e.target.id === 'prefs-form') submitPrefs(e);
    });
    $('#prop-dialog').addEventListener('click', function (e) { if (e.target === this) this.close(); });
    $('#confirm-dialog').addEventListener('click', function (e) { if (e.target === this) this.close(); });
    window.addEventListener('hashchange', function () { render(); $('#page-title').focus(); window.scrollTo(0, 0); });
    window.addEventListener('storage', function (e) {
      if (e.key === K.current && !e.newValue) location.replace('index.html');
    });

    // First paint shows the loading state. TODO phase 2: replace with a real fetch to the PHP/MySQL backend.
    requestAnimationFrame(function () { render(); });
  })();
  </script>
</body>
</html>
